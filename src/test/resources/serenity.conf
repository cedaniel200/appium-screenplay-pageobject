webdriver {
  driver = "provided"
  provided.type = "customappium"
  provided.customappium = "com.cedaniel200.eribank.driver.CustomAppiumDriver"

  timeouts {
    implicitlywait = 10000
  }
}

# Configuración de la app y del dispositivo. Se lee desde CustomAppiumDriver y cualquier
# valor se puede sobrescribir con -Dmobile.<clave>=valor.
mobile {
  platform = "android"
  hub = "http://127.0.0.1:4723"
  app.no.reset = true

  android {
    device.name = "emulator-5554"
    platform.version = "9"
    app.package = "com.experitest.ExperiBank"
    app.activity = "com.experitest.ExperiBank.LoginActivity"
  }

  # iOS no está probado en este entorno
  ios {
    device.name = "iPhone 15"
    platform.version = "17"
    app.bundle.id = "com.experitest.ExperiBank"
  }
}
